name: Publicar livro no GitHub Pages

# Este livro tem muito código R (bestglm, pROC, kableExtra, GGally, stargazer,
# tidyverse...). Renderizar no CI exigiria instalar R e todos esses pacotes a
# cada execução — lento e frágil. Por isso o fluxo aqui é outro:
#
#   1. você roda `quarto render` na sua máquina, onde tudo já funciona
#   2. commita a pasta docs/ junto com as fontes
#   3. este workflow apenas publica docs/ no GitHub Pages
#
# Ou seja: o GitHub não renderiza nada, só serve o que você gerou.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para o deploy nativo do GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está em andamento — assim o
# site nunca fica pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar docs/ no GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar a pasta docs/ como artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
