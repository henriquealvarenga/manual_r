project:
  type: book
  # O GitHub Pages publica a pasta docs/ deste repositório.
  output-dir: docs

book:
  title: "Manual Basico da Linguagem R"
  # Sem barra final: a barra dispara um defeito conhecido do Quarto que produz
  # barra dupla no link canônico.
  site-url: "https://henriquealvarenga.com/manual_r"
  subtitle: "Introdução à análise de dados com a linguagem R, RStudio e Quarto para área da saúde"
  author:
  - name: "Henrique Alvarenga da Silva"
    address: "Departamento de Medicina - UFSJ"
    email: "henriquealvarenga@ufsj.edu.br"
  isbn: "978-65-01-14142-8"
  date: "07/31/2024"
  chapters:
    - index.qmd
    - 00-prefacio.qmd
    - 01-intro.qmd
    - 02-Instalation.qmd
    - 03-RStudio.qmd
    - 04-R-Projects.qmd
    - 05-R-Objects-Variables-Vectors.qmd
    - 06-Dataframes-and-Tibbles.qmd
    - 07-Operators.qmd
    - 08-R-Functions.qmd
    - 09-R-Packages.qmd
    - 10-Reading-data.qmd
    - 11-Manipulating-data.qmd
    - 12-Ploting-graphics.qmd
    - 13-Statistical-Analysis.qmd
    - 14-Distributions.qmd
    - 15-Simulations.qmd
    - 16-Datasets.qmd
    - 17-Conclusion.qmd
    - references.qmd

# Traduz os rótulos gerados pelo Quarto: "Chapter"/"Section" nas referências
# cruzadas, "Table of contents" e "References" na barra lateral.
lang: pt-BR

bibliography: references.bib

# Congela o resultado da execução do R. Cada capítulo só é reexecutado quando o
# próprio .qmd muda — renders seguidos param de gerar diferença espúria em docs/.
#
# Sem isso, duas coisas mudavam a cada render, sem ninguém editar nada:
#   - os capítulos 15 e 16 sorteiam números sem set.seed(), o que é PROPOSITAL:
#     eles ensinam justamente que sem semente o resultado muda a cada execução
#   - str() sobre um tibble do readr imprime o endereço de memória do atributo
#     "problems" (<pointer: 0x...>), que muda a cada sessão do R
#
# Os resultados congelados ficam em _freeze/, que é versionado de propósito.
execute:
  freeze: auto

format:
  html:
    theme: cosmo
    number-sections: true
  pdf:
    documentclass: scrreprt
    number-sections: true

bookdown::epub_book:
  stylesheet: css/style.css

editor: visual

before_body: cover.png {-}

