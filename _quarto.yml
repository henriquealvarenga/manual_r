project:
  type: book
  # O GitHub Pages publica a pasta docs/ deste repositório.
  output-dir: docs

book:
  title: "Manual Básico da Linguagem R"
  # Sem barra final: a barra dispara um defeito conhecido do Quarto que produz
  # barra dupla no link canônico.
  site-url: "https://henriquealvarenga.com/manual_r"
  subtitle: "Introdução à análise de dados com a linguagem R, RStudio e Quarto para área da saúde"
  # Frase que aparece no resultado de busca do Google.
  description: "Introdução prática à análise de dados com R, RStudio e Quarto para a área da saúde: da linguagem básica aos testes estatísticos, regressão e análise de sobrevivência."
  author:
  - name: "Henrique Alvarenga da Silva"
    address: "Departamento de Medicina - UFSJ"
    email: "henriquealvarenga@ufsj.edu.br"
  isbn: "978-65-01-14142-8"
  # Data de publicação da edição com ISBN, registrado em 08/09/2024. O site foi
  # ao ar antes disso, em junho de 2024, e 31/07/2024 era apenas a data em que o
  # conteúdo foi congelado. Em ISO para não virar 9 de agosto: o valor anterior
  # estava em mês/dia/ano.
  date: "2024-09-08"
  # Identificação profissional exigida pela Resolução CFM 2.336/2023 em
  # material assinado por médico: nome, a palavra "médico", especialidade,
  # CRM e RQE. Por isso vai no rodapé de todas as páginas, e não numa página
  # isolada de créditos.
  page-footer:
    left: |
      Dr. Henrique Alvarenga da Silva · Médico Psiquiatra · CRM-MG 31.778 · RQE 8381<br>
      [henriquealvarenga.com](https://henriquealvarenga.com)
    right: |
      Criado com [Quarto](https://quarto.org/)
  chapters:
    - index.qmd
    - 00-prefacio.qmd
    - 01-intro.qmd
    - 02-Instalation.qmd
    - 03-RStudio.qmd
    - 04-R-Projects.qmd
    - 05-R-Objects-Variables-Vectors.qmd
    - 06-Dataframes-and-Tibbles.qmd
    - 07-Operators.qmd
    - 08-R-Functions.qmd
    - 09-R-Packages.qmd
    - 10-Reading-data.qmd
    - 11-Manipulating-data.qmd
    - 12-Ploting-graphics.qmd
    - 13-Statistical-Analysis.qmd
    - 14-Distributions.qmd
    - 15-Simulations.qmd
    - 16-Datasets.qmd
    - 17-Conclusion.qmd
    - references.qmd
    - creditos.qmd

# Traduz os rótulos gerados pelo Quarto: "Chapter"/"Section" nas referências
# cruzadas, "Table of contents" e "References" na barra lateral.
lang: pt-BR

bibliography: references.bib

# Congela o resultado da execução do R. Cada capítulo só é reexecutado quando o
# próprio .qmd muda — renders seguidos param de gerar diferença espúria em docs/.
#
# Sem isso, duas coisas mudavam a cada render, sem ninguém editar nada:
#   - os capítulos 14 e 15 sorteiam números sem set.seed(), o que é PROPOSITAL:
#     eles ensinam justamente que sem semente o resultado muda a cada execução
#   - str() sobre um tibble do readr imprime o endereço de memória do atributo
#     "problems" (<pointer: 0x...>), que muda a cada sessão do R
#
# Os resultados congelados ficam em _freeze/, que é versionado de propósito.
execute:
  freeze: auto

format:
  html:
    theme: cosmo
    # Corrige a largura das colunas do rodapé. Ver os comentários do arquivo.
    css: styles.css
    number-sections: true
    # Declara o endereço oficial de cada página, para o buscador não tratar
    # variações do mesmo endereço como páginas diferentes.
    canonical-url: true
    # Dados estruturados identificando o autor. Ver os comentários do arquivo.
    include-in-header: _includes/autor.html
  pdf:
    documentclass: scrreprt
    number-sections: true
